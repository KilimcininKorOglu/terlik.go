name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Generate SPDG datasets
        run: |
          for lang in tr en es de; do
            go run ./tools/spdg --$lang --pos 100 --neg 100 --seed 42 > /dev/null
          done

      - name: Test
        run: go test -race -count=1 ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        # golangci-lint must be built with a Go at least as new as the version
        # go.mod targets, otherwise it refuses to load the config. The v1 line
        # is built with go1.24 and cannot lint a go1.25 module, so pin the v2
        # line and the action major that drives it.
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.13.2
          args: ./...

      - name: Cyclomatic complexity gate (max 10)
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          test -z "$(gocyclo -over 10 -ignore 'vendor/' .)"

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
